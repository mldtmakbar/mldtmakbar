<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470">
<defs>
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#39d353">
      <animate attributeName="stop-color" values="#39d353;#26a641;#7ee787;#39d353" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#26a641">
      <animate attributeName="stop-color" values="#26a641;#7ee787;#39d353;#26a641" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#26a641"/>
    <stop offset="50%" stop-color="#39d353"/>
    <stop offset="100%" stop-color="#7ee787"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#050a10"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
    <stop offset="45%" stop-color="#39d353" stop-opacity="0.05"/>
    <stop offset="50%" stop-color="#7ee787" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#39d353" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#26a641" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#7ee787" opacity="0.05"/>
  </pattern>
  <mask id="revealMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1180" height="470">
    <rect x="0" y="0" width="1180" height="0" fill="#fff">
      <animate attributeName="height" from="0" to="440" dur="2.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
  </mask>
  <style>
    .ascii  { font-family:'Courier New',Consolas,monospace; font-size:9px; fill:url(#asciiGrad); letter-spacing:0px; }
    .key    { font-family:'Courier New',Consolas,monospace; font-size:15px; fill:#39d353; font-weight:bold; }
    .value  { font-family:'Courier New',Consolas,monospace; font-size:15px; fill:#c9d1d9; }
    .cc     { font-family:'Courier New',Consolas,monospace; font-size:15px; fill:#475569; }
    .head   { font-family:'Courier New',Consolas,monospace; font-size:17px; fill:#7ee787; font-weight:bold; }
    text,tspan { white-space:pre; }
    .term-label  { font-family:'Courier New',Consolas,monospace; font-size:12px; fill:#64748b; letter-spacing:0.5px; }
    .scan-label  { font-family:'Courier New',Consolas,monospace; font-size:10px; fill:#39d353; letter-spacing:1px; }
    .panel-title { font-family:'Courier New',Consolas,monospace; font-size:11px; fill:#7ee787; letter-spacing:2px; opacity:0.7; }
  </style>
</defs>

<rect width="1180" height="470" rx="18" fill="url(#bgGlow)"/>
<rect width="1180" height="470" rx="18" fill="url(#scanlines)"/>

<g id="titlebar">
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#0b1120" fill-opacity="0.85"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"><animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="20" r="5" fill="#f59e0b"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="20" r="5" fill="#39d353"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <text x="590" y="25" text-anchor="middle" class="term-label">mldtmakbar@devos ~ % ./profile.sh --live</text>
  <circle cx="1122" cy="20" r="4" fill="#39d353"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
  <text x="1132" y="24" class="scan-label">SCANNING</text>
</g>

<g transform="translate(0,38)">
  <rect x="14" y="26" width="560" height="360" rx="14" fill="#0b1120" fill-opacity="0.35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35"/>
  <rect x="586" y="26" width="580" height="360" rx="14" fill="#0b1120" fill-opacity="0.35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35"/>
