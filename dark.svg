  </text>
  <text x="30" y="384" class="term-label">&gt; render [OPERATOR] @ [BANDUNG, INDONESIA]</text>
  </g>

  <g mask="url(#revealMask)">
    <text x="602" y="0" fill="#c9d1d9">
